[workspace]
members = [
  "crates/paseo-baseline",
  "crates/paseo-crypto",
  "crates/paseo-differential",
  "crates/paseo-domain",
  "crates/paseo-hub-pilot",
  "crates/paseo-platform-bridge",
  "crates/paseo-plugin-pilot",
  "crates/paseo-relay-pilot",
  "crates/paseo-store",
  "crates/paseo-ui-pilot",
  "crates/paseo-wire",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
