[workspace]
members = [
  "crates/spocky-audio-delivery-pilot",
  "crates/spocky-baseline",
  "crates/spocky-browser-pilot",
  "crates/spocky-cli",
  "crates/spocky-contracts",
  "crates/spocky-crypto",
  "crates/spocky-daemon",
  "crates/spocky-daemon-app",
  "crates/spocky-daemon-relay",
  "crates/spocky-differential",
  "crates/spocky-domain",
  "crates/spocky-hub-pilot",
  "crates/spocky-message-receipts",
  "crates/spocky-pglite-host",
  "crates/spocky-platform-bridge",
  "crates/spocky-plugin-pilot",
  "crates/spocky-provider-claude",
  "crates/spocky-provider-codex",
  "crates/spocky-relay-pilot",
  "crates/spocky-relay-protocol",
  "crates/spocky-session",
  "crates/spocky-slice-harness",
  "crates/spocky-store",
  "crates/spocky-terminal",
  "crates/spocky-ui-pilot",
  "crates/spocky-ui-renderer-pilot",
  "crates/spocky-wire",
  "crates/spocky-workspace-labels",
  "crates/spocky-xterm",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
