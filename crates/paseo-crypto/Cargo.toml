[package]
name = "paseo-crypto"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[dependencies]
base64 = "0.22.1"
crypto_secretbox = { version = "0.1.1", features = ["std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
salsa20 = "0.10.2"
x25519-dalek = { version = "2.0.1", features = ["getrandom", "static_secrets"] }

[dev-dependencies]
serde_json = "1.0.145"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
