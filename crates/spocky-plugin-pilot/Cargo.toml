[package]
name = "spocky-plugin-pilot"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[dependencies]
spocky-contracts = { path = "../spocky-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
