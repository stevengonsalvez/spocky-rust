[package]
name = "spocky-terminal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
serde_json = "1.0.145"
spocky-contracts = { path = "../spocky-contracts" }
spocky-wire = { path = "../spocky-wire" }
spocky-xterm = { path = "../spocky-xterm" }
rustix = { version = "1.1.5", features = ["fs", "process", "pty", "termios"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
sha2 = "0.10.9"
