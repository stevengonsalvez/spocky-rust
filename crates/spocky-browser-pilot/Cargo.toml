[package]
name = "spocky-browser-pilot"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[dependencies]
spocky-contracts = { path = "../spocky-contracts" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
spocky-ui-renderer-pilot = { path = "../spocky-ui-renderer-pilot" }
tao = { version = "0.34.8", default-features = false, features = ["rwh_06"] }
wry = { version = "0.53.5", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
