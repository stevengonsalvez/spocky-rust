[package]
name = "spocky-pglite-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[dependencies]
getrandom = "0.4"
jiff = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
wasmparser = { version = "0.252", default-features = false, features = ["std"] }
wasmtime = { version = "47.0.4", default-features = false, features = ["cache", "cranelift", "parallel-compilation", "runtime", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
