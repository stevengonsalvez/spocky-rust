[package]
name = "spocky-daemon-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[dependencies]
base64 = "0.22"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
spocky-contracts = { path = "../spocky-contracts" }
spocky-daemon = { path = "../spocky-daemon" }
spocky-message-receipts = { path = "../spocky-message-receipts" }
spocky-provider-codex = { path = "../spocky-provider-codex" }
spocky-session = { path = "../spocky-session" }
spocky-store = { path = "../spocky-store" }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync"] }
url = "2.5.8"

[dev-dependencies]
spocky-provider-codex = { path = "../spocky-provider-codex", features = ["test-hooks"] }
spocky-slice-harness = { path = "../spocky-slice-harness" }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
