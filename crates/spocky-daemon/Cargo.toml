[package]
name = "spocky-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[dependencies]
base64 = "0.22"
gethostname = "1"
getrandom = "0.3"
httparse = "1"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"
sha1 = "0.10"
spocky-contracts = { path = "../spocky-contracts" }
spocky-crypto = { path = "../spocky-crypto" }
subtle = "2"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
