name: p4-provider-claude-errno

on:
  push:
    branches: ["ci/p4_provider_claude/errno"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20.0"
      - name: The pinned node
        run: test "$(node --version)" = "v22.20.0"
      - name: Errno table and spawn errors against the pinned node
        env:
          RUST_BACKTRACE: "1"
        run: |
          export SPOCKY_PINNED_NODE="$(command -v node)"
          cargo test --locked -p spocky-provider-claude --test errno_differential -- --nocapture
      - name: The table this host reports
        if: failure()
        run: scripts/phase4/provider-claude-errno-table.sh "$(command -v node)"
